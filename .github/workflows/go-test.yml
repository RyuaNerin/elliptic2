name: Go Test

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.go'
      - '**/*.s'
      - go.mod
      - go.sum
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.go'
      - '**/*.s'
      - go.mod
      - go.sum
  workflow_dispatch:

jobs:
  lint-and-test:
    strategy:
      matrix:
        go-version:
          - '1.24'
          - '1.25'
          - '1.26'
          - '1.27'
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest

    runs-on: ${{ matrix.os }}
    name: Lint and Test - Go ${{ matrix.go-version }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
          
      - name: Set up gotestfmt
        run: go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      - name: golangci-lint (purego)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --build-tags purego

      - name: Build
        run: go build -v ./...

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go test -json -v              ./... 2>&1 | tee "${{ runner.temp }}/gotest.log"        | gotestfmt
          go test -json -v -tags purego ./... 2>&1 | tee "${{ runner.temp }}/gotest-purego.log" | gotestfmt

      - name: Upload test log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-log-${{ matrix.os }}-go${{ matrix.go-version }}
          path: |
            ${{ runner.temp }}/gotest.log
            ${{ runner.temp }}/gotest-purego.log
          if-no-files-found: error

  cross-arch-test:
    needs: lint-and-test
    continue-on-error: true
    strategy:
      matrix:
        include:
        - platform: linux/arm/v6
          image: arm32v6/golang:1.27-alpine
        - platform: linux/arm/v6
          image: arm32v6/golang:1.26-alpine
        - platform: linux/arm/v6
          image: arm32v6/golang:1.25-alpine
        - platform: linux/arm/v6
          image: arm32v6/golang:1.24-alpine
        - platform: linux/arm/v7
          image: arm32v7/golang:1.27-alpine
        - platform: linux/arm/v7
          image: arm32v7/golang:1.26-alpine
        - platform: linux/arm/v7
          image: arm32v7/golang:1.25-alpine
        - platform: linux/arm/v7
          image: arm32v7/golang:1.24-alpine
        - platform: linux/ppc64le
          image: ppc64le/golang:1.27-alpine
        - platform: linux/ppc64le
          image: ppc64le/golang:1.26-alpine
        - platform: linux/ppc64le
          image: ppc64le/golang:1.25-alpine
        - platform: linux/ppc64le
          image: ppc64le/golang:1.24-alpine
        - platform: linux/s390x
          image: s390x/golang:1.27-alpine
        - platform: linux/s390x
          image: s390x/golang:1.26-alpine
        - platform: linux/s390x
          image: s390x/golang:1.25-alpine
        - platform: linux/s390x
          image: s390x/golang:1.24-alpine
        # - platform: linux/mips64le
        #   image: mips64le/golang:1.27-bookworm
        - platform: linux/mips64le
          image: mips64le/golang:1.26-bookworm
        - platform: linux/mips64le
          image: mips64le/golang:1.25-bookworm
        - platform: linux/mips64le
          image: mips64le/golang:1.24-bookworm
        - platform: linux/riscv64
          image: riscv64/golang:1.27-alpine
        - platform: linux/riscv64
          image: riscv64/golang:1.26-alpine
        - platform: linux/riscv64
          image: riscv64/golang:1.25-alpine
        - platform: linux/riscv64
          image: riscv64/golang:1.24-alpine
        - platform: linux/386
          image: i386/golang:1.27-alpine
        - platform: linux/386
          image: i386/golang:1.26-alpine
        - platform: linux/386
          image: i386/golang:1.25-alpine
        - platform: linux/386
          image: i386/golang:1.24-alpine
        - platform: linux/loong64
          image: ghcr.io/loong64/golang:1.27-alpine
        - platform: linux/loong64
          image: ghcr.io/loong64/golang:1.26-alpine
        - platform: linux/loong64
          image: ghcr.io/loong64/golang:1.25-alpine
        - platform: linux/loong64
          image: ghcr.io/loong64/golang:1.24-alpine

    runs-on: [ "self-hosted", "linux" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Test
        run: |
          cd bin/
          bash ./docker-qemu.sh "${{ matrix.platform }}" "${{ matrix.image }}"
